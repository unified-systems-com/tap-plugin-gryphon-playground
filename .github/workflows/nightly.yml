# Nightly self-test + fuzz campaign (Stage 4 of unified-systems-com/tap#363,
# req-tap-plugin-extdev-repo-ci; the campaign row closes unified-systems-com/tap#137).
#
# The push/PR lane (ci.yml) proves the plugin at its declared core FLOOR — the
# reproducible check. This nightly asks the other questions:
#
#   main     "will the next core break us?" — the same reusable workflow against core
#            `main` (the alarm) — and, only after that suite passes, the FUZZ CAMPAIGN:
#            a fresh seed band the executor has never seen, 400 graphs x 25 queries =
#            10,000 (the operator's opening volume, 2026-09-11; the first runs took
#            4-5 minutes), every query classified against the model oracle with the
#            TLP metamorphic relation riding the same suite. A campaign over a broken
#            plugin measures nothing, which is why it runs after the tests, not beside.
#   latest   the latest core release (informational).
#   campaign the verdict: ONE distinct defect fingerprint reds this run, with every
#            defect's seed, query and detail — and how to reproduce one graph, classify
#            (check the oracle first), fix, and lock in — in the job's step summary.
#            No summary at all is NOT OBSERVED and also red: a nightly that produced no
#            verdict is not a pass.
#
# HOW WORD GETS OUT: the red run. Nothing here files an issue or opens a pull request.
# github_core collects every workflow run in the org (`github_actions_run`: event,
# conclusion, age) and the double-tap landing page is where the operator looks, so a
# red nightly — and a nightly that never fired — is visible there without any inbox of
# its own (operator ruling 2026-09-14, unified-systems-com/tap#439; an issue-filing
# reporter was built and withdrawn).
#
# THE LEDGER LANDS ON A BRANCH, never on main by a bot: each clean night appends one
# row to `nightly/fuzz-ledger` (de-duplicated by exact line) and the step summary
# carries the compare link; a human opens the PR from it whenever the rows are worth
# merging — proposed, never pushed, the rule the org applies to pins. The seed band is
# derived from the calendar (2_000_000 + days-since-2026-09-01 x 1000), so it never
# repeats, never collides with the gate's pinned seed (1729) or the July band
# (1_000_000+), and never depends on whether last night's row merged.
#
# A schedule is not evidence — GitHub may delay or skip scheduled runs — so the run
# itself is the record, and the landing page's "no run in 26h" is the heartbeat.
#
# `workflow_dispatch` inputs are for a maintainer's one-off spin (they require write
# access to dispatch); `harness_ref` points the main row at a core branch or SHA.
name: nightly
on:
  schedule:
    - cron: "21 10 * * *"   # minute staggered per repo so the org's nightlies do not burst
  workflow_dispatch:
    inputs:
      harness_ref:
        description: "Core ref for the `main` row — a one-off spin against a core branch (a ref, not a bare SHA). Default: main."
        required: false
        type: string
        default: main
      campaign_graphs:
        description: "Graphs in tonight's band, x 25 queries each. Default 400 = 10,000 queries."
        required: false
        type: string
        default: "400"

permissions:
  contents: read

jobs:
  main:
    name: vs core main + fuzz campaign
    uses: unified-systems-com/tap/.github/workflows/plugin-ci.yml@284d7e7925e2fe050a82ed60c3c196653ce2af2d
    with:
      plugin_slug: gryphon_playground
      harness_ref: ${{ inputs.harness_ref || 'main' }}
      boot_and_test_timeout_minutes: 90
      # Runs inside the booted web container after the in-package suite passes; it is
      # sh (dash), not bash. The band start comes from the calendar, the provenance stamp
      # names both commits (handed in by plugin-ci as TAP_CI_*_SHA), and the summary is
      # kept for the verdict job. The graph count is a maintainer dispatch input.
      after_tests_command: >-
        mkdir -p /app/after-tests-out &&
        export GRYPHON_FUZZ_CAMPAIGN_BASE=$((2000000 + ($(date -u +%s) - 1788220800) / 86400 * 1000)) &&
        export GRYPHON_FUZZ_CAMPAIGN_SUMMARY_COPY=/app/after-tests-out/campaign-summary.json &&
        export TAP_FUZZ_COMMIT="core@$(echo "$TAP_CI_HARNESS_SHA" | cut -c1-8)+plugin@$(echo "$TAP_CI_PLUGIN_SHA" | cut -c1-8)" &&
        scripts/gryphon-fuzz-campaign ${{ inputs.campaign_graphs || '400' }} 25
      # Confined by plugin-ci to this checkout and after-tests-out/ — never the harness
      # tree at large.
      after_tests_artifact_paths: |
        _dev-plugins/gryphon_playground/tap_plugin/gryphon_playground/gridkin/fuzz-campaign-log.jsonl
        after-tests-out/campaign-summary.json
    secrets:
      harness_pat: ${{ secrets.TAP_CORE_RO_PAT }}

  latest:
    name: vs latest core release (v0.1.6, informational)
    uses: unified-systems-com/tap/.github/workflows/plugin-ci.yml@284d7e7925e2fe050a82ed60c3c196653ce2af2d
    with:
      plugin_slug: gryphon_playground
      harness_ref: v0.1.6
    secrets:
      harness_pat: ${{ secrets.TAP_CORE_RO_PAT }}

  # The ledger row lands on one persistent branch — only after a green main row, since a
  # row from a run whose suite failed is a row about nothing. The only write scope in
  # this workflow, on this job only. No pull request is opened (org policy keeps that
  # switch off, and a human opening it from the compare link is the intended shape).
  ledger:
    name: append the ledger row on the ledger branch
    needs: [main]
    if: needs.main.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      LEDGER: tap_plugin/gryphon_playground/gridkin/fuzz-campaign-log.jsonl
      BRANCH: nightly/fuzz-ledger
    outputs:
      compare_url: ${{ steps.push.outputs.compare_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: after-tests
          path: campaign
      - name: Append tonight's row on the persistent ledger branch
        id: push
        run: |
          set -euo pipefail
          row="$(tail -n 1 "campaign/_dev-plugins/gryphon_playground/$LEDGER")"
          [ -n "$row" ] || { echo "::error::no ledger row in the after-tests artifact"; exit 1; }
          summary="$(python3 - <<'PY'
          import json
          s = json.load(open("campaign/after-tests-out/campaign-summary.json", encoding="utf-8"))
          t = s["totals"]
          print(
              f"{s['n_queries']} queries over seeds {s['base_seed']}-{s['seed_end']}: "
              f"agree {t.get('agree', 0)}, diverge {t.get('diverge', 0)}, rejected {t.get('rejected', 0)}, "
              f"crashed {t.get('crashed', 0)}, unmodeled {t.get('unmodeled', 0)}; "
              f"{s['distinct_defects']} distinct defect(s), oracle-asserted {s['asserted_fraction'] * 100:.1f}%"
          )
          PY
          )"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch -q origin "$BRANCH"
            git checkout -q -B "$BRANCH" FETCH_HEAD
          else
            git checkout -q -B "$BRANCH" origin/main
          fi
          # De-duplicate by BAND, not by exact line: the band is calendar-derived, so a
          # second dispatch on the same day re-runs the same seeds with a different
          # commit stamp — a ledger measuring fresh bands must hold each band once.
          base="$(python3 -c 'import json; print(json.load(open("campaign/after-tests-out/campaign-summary.json"))["base_seed"])')"
          if grep -qF -- "\"base_seed\": $base," "$LEDGER"; then
            echo "band starting at $base already on the ledger — nothing to append"
          else
            printf '%s\n' "$row" >> "$LEDGER"
          fi
          git add "$LEDGER"
          if ! git diff --cached --quiet; then
            git commit -q \
              -m "chore(ledger): fuzz campaign $(date -u +%Y-%m-%d) — $summary" \
              -m "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          fi
          compare="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
          rows="$(git rev-list --count origin/main..HEAD)"
          echo "compare_url=$compare" >> "$GITHUB_OUTPUT"
          {
            echo "### Ledger"
            echo
            echo "$summary"
            echo
            echo "Row landed on \`$BRANCH\` ($rows unmerged night(s)). Open the PR when the rows are worth merging: $compare"
            echo
            echo "Every row is one campaign over a fresh calendar-derived band; the trend this exists for is distinct new defects per 100k queries, declining as the executor hardens, with the oracle-asserted fraction beside it so a falling rate cannot hide a generator that stopped exploring."
          } >> "$GITHUB_STEP_SUMMARY"

  # The verdict. A defect reds the run; a missing summary is NOT OBSERVED and also red.
  campaign:
    name: fuzz campaign verdict
    needs: [main, ledger]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true   # absent when the suite failed first; the script renders that as NOT OBSERVED
        with:
          name: after-tests
          path: campaign
      - name: Verdict (reds the run on a defect; writes the step summary)
        env:
          MAIN_RESULT: ${{ needs.main.result }}
          LEDGER_URL: ${{ needs.ledger.outputs.compare_url }}
        run: python3 .github/scripts/campaign_verdict.py campaign/after-tests-out/campaign-summary.json "$MAIN_RESULT" "$LEDGER_URL"
