# CI for tap-plugin-gryphon-playground.
#
# A thin caller. All the logic lives in the reusable workflow in the core TAP repo
# (`.github/workflows/plugin-ci.yml`, req-plugin-extdev-repo-ci) so every plugin repo —
# ours and external developers' — runs the SAME admission gate, and improving it is one
# edit in one place rather than a fan-out across a dozen repos.
#
# Since 2026-08-08 core is PUBLIC on the unified-systems-com org, which removed both of
# the old silent-failure prerequisites: public reusable workflows are callable from any
# repo (no Actions access_level sharing needed), and core can be checked out with no
# credential at all. `harness_pat` is still plumbed through for now — retiring
# TAP_CORE_RO_PAT is a separate, deliberate step — but a missing/expired value is no
# longer fatal to checkout.
#
# `boot_profile` is intentionally omitted: the Django-free conformance job (structure +
# requires_tap compatibility floor) is the gate here. A plugin that needs a real stack
# ships a ci/nightly.boot.json and passes boot_profile to opt into the boot-and-test job
# (see tap-plugin-samsite / tap-plugin-aws-core for the worked example).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs matter for a plugin repo: core can regress the plugin without a single
  # commit landing HERE, and nothing else would re-run this gate before the nightly.
  workflow_dispatch:

# Explicit least-privilege GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  tap:
    # `contents: write` on THIS job, not at the top of the file: plugin-ci.yml's
    # submit-dependency-snapshot job declares `contents: write` (it POSTs to the
    # dependency-graph snapshots API), and a called workflow cannot hold more than its
    # caller granted — so without this the whole run ends in `startup_failure` before any
    # job exists, which is what this repo has been doing on every run (tap#772, tap#796).
    # plugin-ci.yml says to add it here in as many words. Eight sibling plugin repos
    # already carry exactly this grant; the top-level default stays `contents: read`.
    permissions:
      contents: write
    # Pinned by commit SHA, not by a name: `@main` lets whoever moves tap's default branch
    # decide which validation logic runs here, so a green run would not attest to the logic
    # this repo reviewed (tap#376's done-test; validate_plugin --repo enforces it). This SHA
    # is tap main as of 2026-09-25, which is the logic this lane was already running.
    uses: unified-systems-com/tap/.github/workflows/plugin-ci.yml@32148e00e6fc2f19bded21e883f5151b4bbd1342
    with:
      plugin_slug: gryphon_playground
      # Pinned deliberately. `main` means "whatever core is today", which turns an
      # unrelated core change into a surprise red here. Bump this on purpose.
      harness_ref: main
    secrets:
      harness_pat: ${{ secrets.TAP_CORE_RO_PAT }}
